services:
  # 数据库服务
  db:
    image: mysql:8.0
    container_name: smart-diancan-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_USER_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-menu}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_USER_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis:
    image: redis:7.0-alpine
    container_name: smart-diancan-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
