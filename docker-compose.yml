version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart-diancan-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_diancan
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: smart-diancan-backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=smart_diancan
      - DASHSCOPE_API_KEY=sk-e835f544a996476eb0393c3d430a8008
      - DASHSCOPE_MODEL_NAME=qwen3.7-flash
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db

  frontend:
    build: ./ui
    container_name: smart-diancan-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  chroma_data:
