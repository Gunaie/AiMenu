[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "chroma_db", "ui", "data"]

[tool.ruff.lint]
# E/F 是通用正确性基线：语法错误、未定义名称、未使用导入、未使用变量
select = ["E", "F"]
# 长行不阻断（项目里有多处菜品描述拼接），import 位置已有显式 noqa 处理
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
